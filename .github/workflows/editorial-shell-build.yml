name: Editorial Shell Build

on:
  pull_request:
    paths:
      - 'editorial-shell/**'
      - 'src/editorial/**'
      - 'src/app/data/editorial-*.ts'
      - 'docs/editorial/**'
      - '.github/workflows/editorial-shell-build.yml'
      - '.github/workflows/editorial-preview-witness.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  R2_6_PREVIEW_ORIGIN: https://r2-6-preview-production.up.railway.app
  R2_6_DEPLOYMENT_COMMIT: 17f3f01f06876811e6ca2f8a48c2de8da9b0efbf
  R2_6_DEPLOYMENT_ID: 52b5b9ef-a80a-4ee2-8c54-20aa25975553

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editorial-shell/package-lock.json

      - name: Install locked shell dependencies
        working-directory: editorial-shell
        run: npm ci

      - name: Materialize A2.8 current renderer input
        working-directory: editorial-shell
        run: npm run materialize:current-input

      - name: Emit A2.8 current distribution
        working-directory: editorial-shell
        run: npm run materialize:current-distribution

      - name: Build static editorial shell
        working-directory: editorial-shell
        run: npm run build

      - name: Verify physical static output
        working-directory: editorial-shell
        run: node scripts/verify-output.mjs

      - name: Verify compatibility redirect HTTP adapter
        working-directory: editorial-shell
        run: node scripts/verify-redirect-adapter.mjs

      - name: Commission full static runtime
        working-directory: editorial-shell
        run: npm run verify:commissioned

      - name: Verify isolated preview binding
        working-directory: editorial-shell
        run: npm run verify:preview-entrypoint

      - name: Freeze accepted public preview provenance
        run: |
          echo "preview_origin=$R2_6_PREVIEW_ORIGIN"
          echo "deployment_commit=$R2_6_DEPLOYMENT_COMMIT"
          echo "deployment_id=$R2_6_DEPLOYMENT_ID"
          test "$R2_6_PREVIEW_ORIGIN" != "https://renan.snelabs.space"
          test "$R2_6_PREVIEW_ORIGIN" != "https://www.renan.snelabs.space"

      - name: Witness real Internet TLS hosting invariance
        working-directory: editorial-shell
        env:
          PREVIEW_ORIGIN: ${{ env.R2_6_PREVIEW_ORIGIN }}
          R2_6_WITNESS_PATH: r2-6-preview-witness.json
        run: npm run verify:preview

      - name: Preserve shell and environmental witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-physical-witness-${{ github.sha }}
          path: |
            editorial-shell/package-lock.json
            editorial-shell/dist
            editorial-shell/current-emission
            editorial-shell/r2-6-preview-witness.json
            editorial-shell/r2-a1-1-current-renderer-input-witness.json
            editorial-shell/r2-a1-2-current-distribution-witness.json
          if-no-files-found: warn
          retention-days: 30
