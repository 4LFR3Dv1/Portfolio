name: Editorial Shell Build

on:
  pull_request:
    paths:
      - 'editorial-shell/**'
      - 'src/editorial/**'
      - 'src/app/data/editorial-*.ts'
      - 'docs/editorial/**'
      - '.github/workflows/editorial-shell-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize exact shell dependency graph
        working-directory: editorial-shell
        run: npm install --package-lock-only --ignore-scripts

      - name: Seal shell dependency graph on PR branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial-shell/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "R2.1 seal Astro dependency graph"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Install shell dependencies
        working-directory: editorial-shell
        run: npm ci

      - name: Build static editorial shell
        working-directory: editorial-shell
        run: npm run build

      - name: Verify physical static output
        working-directory: editorial-shell
        run: node scripts/verify-output.mjs

      - name: Preserve shell witness
        uses: actions/upload-artifact@v4
        with:
          name: r2-1-editorial-shell-${{ github.sha }}
          path: |
            editorial-shell/package-lock.json
            editorial-shell/dist
          if-no-files-found: error
          retention-days: 14
