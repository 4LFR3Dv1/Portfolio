name: Portfolio Editorial Integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-composed-site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install portfolio dependencies
        run: npm ci
      - name: Verify existing portfolio
        run: npm run verify
      - name: Build composed portfolio + editorial
        run: npm run build:composed
      - name: Verify composed output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/editorial/index.html
          test -f dist/editorial/quando-um-navegador-deixa-de-ser-uma-ferramenta/index.html
          test -f dist/editorial/onde-existe-uma-rede/index.html
          test -f dist/editorial/o-passado-de-um-sistema-nao-existe/index.html
          test ! -e dist/editorial/systems/brineos
          test ! -e dist/editorial/systems/genesis
          grep -F 'https://renan.snelabs.space/editorial/quando-um-navegador-deixa-de-ser-uma-ferramenta/' dist/editorial/quando-um-navegador-deixa-de-ser-uma-ferramenta/index.html
          grep -F 'og:title' dist/editorial/quando-um-navegador-deixa-de-ser-uma-ferramenta/index.html
          grep -F 'www.linkedin.com/sharing/share-offsite' dist/editorial/quando-um-navegador-deixa-de-ser-uma-ferramenta/index.html
          grep -R -F 'Projeto e construo sistemas de software.' dist/assets
          echo 'PORTFOLIO + ESSAY EDITORIAL COMPOSED BUILD: PASS'
      - name: Witness composed preview routing
        shell: bash
        run: |
          set -euo pipefail
          PORT=4173 node editorial-shell/runtime/composed-preview-runtime.mjs > /tmp/composed-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/tmp/root.html; then
              break
            fi
            sleep 0.2
          done

          curl -fsS http://127.0.0.1:4173/architecture >/tmp/architecture.html
          curl -fsS http://127.0.0.1:4173/work/vira >/tmp/work.html
          curl -fsS http://127.0.0.1:4173/editorial/ >/tmp/editorial.html
          curl -fsS http://127.0.0.1:4173/editorial/quando-um-navegador-deixa-de-ser-uma-ferramenta/ >/tmp/essay.html

          root_sha=$(sha256sum /tmp/root.html | cut -d' ' -f1)
          architecture_sha=$(sha256sum /tmp/architecture.html | cut -d' ' -f1)
          work_sha=$(sha256sum /tmp/work.html | cut -d' ' -f1)
          test "$root_sha" = "$architecture_sha"
          test "$root_sha" = "$work_sha"

          grep -F 'EDITORIAL // RENAN MELO' /tmp/editorial.html
          grep -F 'Quando um navegador deixa de ser uma ferramenta?' /tmp/essay.html
          grep -F 'og:title' /tmp/essay.html

          brine_status=$(curl -sS -o /tmp/brine.html -w '%{http_code}' http://127.0.0.1:4173/editorial/systems/brineos/)
          test "$brine_status" = '404'
          missing_status=$(curl -sS -o /tmp/missing.html -w '%{http_code}' http://127.0.0.1:4173/editorial/does-not-exist/)
          test "$missing_status" = '404'

          echo "react_spa_root_sha256=sha256:$root_sha"
          echo 'editorial_index_status=200'
          echo 'editorial_essay_status=200'
          echo 'editorial_brine_status=404'
          echo 'editorial_missing_status=404'
          echo 'PORTFOLIO + EDITORIAL ROUTING: PASS'
