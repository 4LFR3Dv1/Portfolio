name: Editorial Cutover Readiness

on:
  pull_request:
    paths:
      - 'editorial-shell/**'
      - 'docs/editorial/**'
      - 'src/editorial/**'
      - 'package.json'
      - 'vercel.json'
      - '.github/workflows/editorial-cutover-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  R2_7_ACCEPTED_TARGET_ORIGIN: https://r2-6-preview-production.up.railway.app
  R2_7_ACCEPTED_TARGET_DEPLOYMENT: 52b5b9ef-a80a-4ee2-8c54-20aa25975553

jobs:
  readiness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editorial-shell/package-lock.json

      - name: Install locked shell dependencies
        working-directory: editorial-shell
        run: npm ci

      - name: Build exact editorial shell
        working-directory: editorial-shell
        run: npm run build

      - name: Re-prove R2.5 commissioned runtime
        working-directory: editorial-shell
        run: npm run verify:commissioned

      - name: Re-prove R2.6 preview binding
        working-directory: editorial-shell
        run: npm run verify:preview-entrypoint

      - name: Fresh external witness of accepted R2.6 target
        working-directory: editorial-shell
        env:
          PREVIEW_ORIGIN: ${{ env.R2_7_ACCEPTED_TARGET_ORIGIN }}
          R2_6_WITNESS_PATH: r2-7-target-witness.json
        run: npm run verify:preview

      - name: Observe current production and freeze rollback baseline
        working-directory: editorial-shell
        env:
          R2_7_TARGET_WITNESS_PATH: r2-7-target-witness.json
          R2_7_READINESS_WITNESS_PATH: r2-7-cutover-readiness-witness.json
        run: npm run verify:cutover-readiness

      - name: Preserve readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-7-cutover-readiness-${{ github.sha }}
          path: |
            editorial-shell/r2-7-target-witness.json
            editorial-shell/r2-7-cutover-readiness-witness.json
          if-no-files-found: warn
          retention-days: 30
